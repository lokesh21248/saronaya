<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-biz" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061B3A"/>
      <stop offset="50%" stop-color="#092653"/>
      <stop offset="100%" stop-color="#1456A0"/>
    </linearGradient>
    <linearGradient id="bar-gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8D77A"/>
      <stop offset="100%" stop-color="#E9AC32"/>
    </linearGradient>
    <linearGradient id="bar-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1456A0"/>
    </linearGradient>
    <filter id="glow-biz">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#bg-biz)"/>
  <circle cx="650" cy="120" r="160" fill="#1456A0" opacity="0.3" filter="url(#glow-biz)"/>
  <circle cx="160" cy="360" r="130" fill="#E9AC32" opacity="0.2" filter="url(#glow-biz)"/>
  
  {/* 3D Dashboard Chart Graphic */}
  <g transform="translate(260, 90)" filter="url(#glow-biz)">
    <rect x="0" y="0" width="280" height="170" rx="20" fill="#061B3A" stroke="#E9AC32" stroke-width="2" opacity="0.85"/>
    {/* Grid lines */}
    <line x1="30" y1="40" x2="250" y2="40" stroke="#1e40af" stroke-width="1" stroke-dasharray="4"/>
    <line x1="30" y1="80" x2="250" y2="80" stroke="#1e40af" stroke-width="1" stroke-dasharray="4"/>
    <line x1="30" y1="120" x2="250" y2="120" stroke="#1e40af" stroke-width="1" stroke-dasharray="4"/>
    {/* Trend line */}
    <path d="M 45 110 L 95 85 L 145 100 L 195 50 L 235 35" fill="none" stroke="#F8D77A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="235" cy="35" r="5" fill="#E9AC32"/>
    {/* Bars */}
    <rect x="50" y="90" width="18" height="45" rx="4" fill="url(#bar-blue)"/>
    <rect x="100" y="70" width="18" height="65" rx="4" fill="url(#bar-gold)"/>
    <rect x="150" y="80" width="18" height="55" rx="4" fill="url(#bar-blue)"/>
    <rect x="200" y="45" width="18" height="90" rx="4" fill="url(#bar-gold)"/>
  </g>

  <text x="400" y="325" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="2">BUSINESS ANALYTICS</text>
  <text x="400" y="360" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="13" fill="#F8D77A" text-anchor="middle" letter-spacing="3">POWER BI • TABLEAU • FINANCIAL MODELING</text>
</svg>
